<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin · Sweet Crumb</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="apple-touch-icon.png" type="image/png" sizes="180x180">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#b4562a">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site">
  <a class="brand" href="index.html"><span class="mark">🥐</span> Sweet Crumb</a>
  <nav class="site"></nav>
</header>

<main>
  <div class="page-head">
    <h1>Admin dashboard</h1>
    <p>Add products, set prices and discounts, and move orders along.</p>
  </div>
  <div id="out"><p class="muted">Checking access…</p></div>
</main>

<script type="module">
import { supabase, money, finalPrice, esc, paintHeader, openAuth, uploadProductImage }
  from './app.js'

const { user, admin } = await paintHeader('admin.html')
const out = document.getElementById('out')

/* This gate is convenience, not security. Even with it edited away in DevTools,
   every write below still has to pass bakery_is_admin() inside the database, and
   so does every image upload. */
if (!user) {
  out.innerHTML = `<div class="empty"><span class="mark">🔒</span>
    Sign in with an admin account.<br><br>
    <button class="btn" id="go">Sign in</button></div>`
  document.getElementById('go').addEventListener('click', openAuth)
} else if (!admin) {
  out.innerHTML = `<div class="empty"><span class="mark">⛔</span>
    <b>${esc(user.email)}</b> is not an admin account.<br>
    <span class="muted">Ask the owner to add this email to the admin list.</span></div>`
} else {
  out.innerHTML = `
    <section class="card rise" style="padding:20px 22px;margin-bottom:26px">
      <h2 style="font-size:18px;margin-bottom:14px">Add a product</h2>
      <form id="newProduct">
        <div class="row">
          <label class="field" style="flex:2;min-width:190px"><span>Name</span>
            <input name="name" required maxlength="120"></label>
          <label class="field" style="flex:1;min-width:110px"><span>Price (Rs)</span>
            <input name="price" type="number" min="0" step="1" required></label>
          <label class="field" style="flex:1;min-width:110px"><span>Discount %</span>
            <input name="discount_percent" type="number" min="0" max="90" value="0"></label>
        </div>
        <label class="field"><span>Description</span>
          <input name="description" maxlength="500"
                 placeholder="One line customers will read"></label>

        <span style="display:block;font-size:13px;font-weight:650;color:var(--muted);
                     margin-bottom:5px">Picture</span>
        <div class="tabs" id="imgTabs">
          <button type="button" data-src="file" class="on">Upload a file</button>
          <button type="button" data-src="url">Paste a link</button>
        </div>

        <div id="paneFile">
          <div class="drop" id="drop">
            <span class="mark">🖼️</span>
            Click to choose an image, or drag one here
            <br><span style="font-size:12px">JPG, PNG, WebP, GIF or AVIF · up to 3 MB</span>
          </div>
          <input type="file" id="file" accept="image/*" hidden>
          <div id="preview"></div>
        </div>

        <div id="paneUrl" hidden>
          <input name="image_url" type="url" placeholder="https://…" maxlength="500">
          <p class="muted" style="font-size:12.5px;margin:6px 0 0">
            Must start with https://</p>
        </div>

        <div id="npMsg" style="margin-top:14px"></div>
        <button class="btn">Add product</button>
      </form>
    </section>

    <h2 style="font-size:18px;margin-bottom:12px">Products</h2>
    <div class="card table-wrap rise" style="margin-bottom:30px"><table id="prodTable">
      <tr><th></th><th>Name</th><th class="num">Price</th><th class="num">Disc %</th>
          <th class="num">Sells for</th><th>Shown</th><th></th></tr>
    </table></div>

    <h2 style="font-size:18px;margin-bottom:12px">Orders</h2>
    <div class="card table-wrap rise"><table id="orderTable">
      <tr><th>When</th><th>Customer</th><th>Items</th>
          <th class="num">Total</th><th>Status</th></tr>
    </table></div>

    <input type="file" id="rowFile" accept="image/*" hidden>`

  await loadProducts()
  await loadOrders()
  wireAddForm()
}

/* ------------------------------------------------------------- add product */

function wireAddForm () {
  const form   = document.getElementById('newProduct')
  const tabs   = document.getElementById('imgTabs')
  const drop   = document.getElementById('drop')
  const file   = document.getElementById('file')
  const prev   = document.getElementById('preview')
  const msg    = document.getElementById('npMsg')
  const btn    = form.querySelector('button.btn')
  let mode = 'file'
  let chosen = null

  tabs.addEventListener('click', e => {
    const b = e.target.closest('button[data-src]')
    if (!b) return
    mode = b.dataset.src
    tabs.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b))
    document.getElementById('paneFile').hidden = mode !== 'file'
    document.getElementById('paneUrl').hidden  = mode !== 'url'
  })

  const showPreview = f => {
    chosen = f
    const url = URL.createObjectURL(f)
    prev.innerHTML = `<div class="preview">
      <img src="${url}" alt="">
      <div style="flex:1">
        <b style="font-size:13.5px">${esc(f.name)}</b><br>
        <span class="muted" style="font-size:12.5px">
          ${(f.size / 1024).toFixed(0)} KB</span>
      </div>
      <button class="btn ghost sm" type="button" id="clearPic">Remove</button>
    </div>`
    prev.querySelector('#clearPic').addEventListener('click', () => {
      chosen = null; file.value = ''; prev.innerHTML = ''
    })
  }

  drop.addEventListener('click', () => file.click())
  file.addEventListener('change', () => file.files[0] && showPreview(file.files[0]))

  ;['dragenter', 'dragover'].forEach(ev =>
    drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over') }))
  ;['dragleave', 'drop'].forEach(ev =>
    drop.addEventListener(ev, () => drop.classList.remove('over')))

  drop.addEventListener('drop', e => {
    e.preventDefault()
    const f = e.dataTransfer.files[0]
    if (f) showPreview(f)
  })

  form.addEventListener('submit', async e => {
    e.preventDefault()
    msg.innerHTML = ''
    btn.classList.add('busy')

    let image_url = null
    try {
      if (mode === 'file' && chosen) image_url = await uploadProductImage(chosen)
      else if (mode === 'url') image_url = form.image_url.value.trim() || null
    } catch (err) {
      btn.classList.remove('busy')
      msg.innerHTML = `<div class="notice err">Upload failed: ${esc(err.message)}</div>`
      return
    }

    const { error } = await supabase.from('bakery_products').insert({
      name: form.name.value.trim(),
      description: form.description.value.trim(),
      price: Number(form.price.value),
      discount_percent: Number(form.discount_percent.value || 0),
      image_url
    })

    btn.classList.remove('busy')
    if (error) {
      msg.innerHTML = `<div class="notice err">${esc(error.message)}</div>`
      return
    }

    msg.innerHTML = `<div class="notice ok">Added.</div>`
    form.reset()
    form.discount_percent.value = 0
    chosen = null
    prev.innerHTML = ''
    await loadProducts()
    setTimeout(() => { msg.innerHTML = '' }, 2500)
  })
}

/* ----------------------------------------------------------------- products */

async function loadProducts () {
  const table = document.getElementById('prodTable')
  const { data, error } = await supabase
    .from('bakery_products').select('*').order('created_at')

  const head = table.rows[0].outerHTML
  if (error) {
    table.innerHTML = head + `<tr><td colspan="7" class="notice err">
      ${esc(error.message)}</td></tr>`
    return
  }

  table.innerHTML = head + data.map(p => `
    <tr data-id="${p.id}">
      <td>${p.image_url
            ? `<img class="thumb" src="${esc(p.image_url)}" alt="">`
            : `<div class="thumb"></div>`}</td>
      <td>${esc(p.name)}</td>
      <td class="num"><input data-f="price" type="number" min="0" step="1"
            value="${p.price}" style="width:92px;text-align:right"></td>
      <td class="num"><input data-f="discount_percent" type="number" min="0" max="90"
            value="${p.discount_percent}" style="width:72px;text-align:right"></td>
      <td class="num"><b>${money(finalPrice(p))}</b></td>
      <td><input data-f="is_available" type="checkbox" ${p.is_available ? 'checked' : ''}></td>
      <td class="right" style="white-space:nowrap">
        <button class="btn ghost sm" data-pic="${p.id}">Picture</button>
        <button class="btn sm" data-save="${p.id}">Save</button>
        <button class="btn sm danger" data-del="${p.id}">Delete</button>
      </td>
    </tr>`).join('')

  table.onclick = async e => {
    const btn  = e.target.closest('button')
    if (!btn) return
    const save = btn.dataset.save
    const del  = btn.dataset.del
    const pic  = btn.dataset.pic

    if (pic) return changePicture(pic)
    if (!save && !del) return

    const row = btn.closest('tr')
    btn.classList.add('busy')

    if (del) {
      if (!confirm('Delete this product? Past orders keep their own copy of the name and price.')) {
        btn.classList.remove('busy')
        return
      }
      const { error } = await supabase.from('bakery_products').delete().eq('id', del)
      if (error) { alert(error.message); btn.classList.remove('busy'); return }
    } else {
      const get = f => row.querySelector(`[data-f="${f}"]`)
      const { error } = await supabase.from('bakery_products').update({
        price: Number(get('price').value),
        discount_percent: Number(get('discount_percent').value),
        is_available: get('is_available').checked
      }).eq('id', save)
      if (error) { alert(error.message); btn.classList.remove('busy'); return }
    }
    await loadProducts()
  }
}

// Replace one product's picture with an uploaded file.
function changePicture (id) {
  const input = document.getElementById('rowFile')
  input.value = ''
  input.onchange = async () => {
    const f = input.files[0]
    if (!f) return
    const cell = document.querySelector(`tr[data-id="${id}"] td:first-child`)
    if (cell) cell.innerHTML = `<div class="thumb skel" style="height:40px"></div>`
    try {
      const url = await uploadProductImage(f)
      const { error } = await supabase.from('bakery_products')
        .update({ image_url: url }).eq('id', id)
      if (error) throw error
    } catch (err) {
      alert('Could not update the picture: ' + err.message)
    }
    await loadProducts()
  }
  input.click()
}

/* ------------------------------------------------------------------- orders */

async function loadOrders () {
  const table = document.getElementById('orderTable')
  const { data, error } = await supabase
    .from('bakery_orders')
    .select('*, bakery_order_items(product_name, qty)')
    .order('created_at', { ascending: false })

  const head = table.rows[0].outerHTML
  if (error) {
    table.innerHTML = head + `<tr><td colspan="5" class="notice err">
      ${esc(error.message)}</td></tr>`
    return
  }
  if (!data.length) {
    table.innerHTML = head + `<tr><td colspan="5" class="muted">No orders yet.</td></tr>`
    return
  }

  const states = ['pending', 'confirmed', 'delivered', 'cancelled']

  table.innerHTML = head + data.map(o => `
    <tr>
      <td>${new Date(o.created_at).toLocaleString('en-PK',
            { dateStyle: 'short', timeStyle: 'short' })}</td>
      <td>${esc(o.customer_name)}<br>
          <span class="muted" style="font-size:13px">${esc(o.phone)}</span><br>
          <span class="muted" style="font-size:13px">${esc(o.address)}</span></td>
      <td>${o.bakery_order_items.map(i =>
            `${esc(i.product_name)} ×${i.qty}`).join('<br>')}</td>
      <td class="num"><b>${money(o.total)}</b></td>
      <td>
        <select data-status="${o.id}" style="width:auto">
          ${states.map(s =>
            `<option value="${s}"${s === o.status ? ' selected' : ''}>${s}</option>`).join('')}
        </select>
      </td>
    </tr>`).join('')

  table.onchange = async e => {
    const id = e.target.dataset?.status
    if (!id) return
    e.target.disabled = true
    const { error } = await supabase.from('bakery_orders')
      .update({ status: e.target.value }).eq('id', id)
    e.target.disabled = false
    if (error) { alert(error.message); await loadOrders() }
  }
}
</script>
</body>
</html>
